<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - PhaDent Dental Clinic</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">

        <div class="logo">
            <h1>PhaDent Dental Clinic</h1>
        </div>

        <nav class="navbar">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="doctors.html">Doctors</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>

    </header>

    <main>

        <section class="page-hero">
            <h2>Contact Us</h2>
            <p>Book an appointment or send a message</p>
        </section>

        <section class="contact-section">

            <div class="contact-info">

                <h3>Clinic Info</h3>
                <p>Phone: +995 555 123 456</p>
                <p>Email: info@phadent.com</p>
                <p>Location: Tbilisi, Georgia</p>

            </div>

            <form class="contact-form" action="php/contact.php" method="POST">

                <fieldset>

                    <legend>Appointment Form</legend>

                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" placeholder="Your name" required>

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Your email" required>

                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">

                    <label for="date">Preferred Date</label>
                    <input type="date" id="date" name="date">

                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Write your message" required></textarea>

                    <button type="submit" class="btn">Send</button>

                </fieldset>

            </form>

        </section>

    </main>

    <footer class="footer">
        <p>© 2026 PhaDent Dental Clinic</p>
    </footer>

    <script src="js/script.js"></script>

</body>

</html>
